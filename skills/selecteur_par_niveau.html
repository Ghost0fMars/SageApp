er des informations.", "Exprimer ses sentiments et réagir à des sentiments exprimés.", "Reformuler un point pour quelqu'un qui n'a pas compris.", "Synthétiser les informations essentielles d'un document pour quelqu'un qui n'en a pas eu connaissance.", "Niveau A1", "Interagir brièvement dans des situations déjà connues en utilisant des mots et expressions simples et avec un débit lent.", "Niveau A2", "Interagir avec une aisance raisonnable dans des situations bien structurées et de courtes conversations à condition que le locuteur apporte de l'aide le cas échéant.", "Niveau B1", "Exprimer un avis, manifester un sentiment et donner quelques éléments simples de contexte sur un sujet abstrait ou culturel."], "Parler en continu": ["Présenter, décrire : événements, activités passées, expériences personnelles.", "Se raconter : origine, famille, voyages, imaginaire, projets.", "Expliquer à d'autres un fait culturel.", "Exprimer son opinion personnelle sur une œuvre, un fait de société, et argumenter.", "Formuler des hypothèses sur un contenu, un événement ou une expérience future.", "Niveau A1", "Produire des expressions simples, isolées, sur les gens et les choses.", "Niveau A2", "Décrire ou présenter simplement des gens, des conditions de vie, des activités quotidiennes, ce qu'on aime ou pas, par de courtes séries d'expressions ou de phrases.", "Niveau B1", "Pouvoir assez aisément mener à bien une description directe et non compliquée de sujets variés dans son domaine en la présentant comme une succession linéaire de points."], "Écrire et réagir à l'écrit": ["Prendre des notes/les mettre en forme et reformuler de manière ordonnée.", "Résumer. Rendre compte.", "Rédiger en réaction à un message ou à une situation vécue.", "Écrire une histoire, un article, une publicité.", "Écrire à la manière de...", "Niveau A1", "Ecrire des expressions et phrases simples isolées.", "Niveau A2", "Ecrire une série d'expressions et de phrases simples reliées par des connecteurs simples tels que « et », « mais » et « parce que ».", "Niveau B1", "Ecrire un énoncé simple et bref sur des sujets familiers ou déjà connus."]}, "Connaissances culturelles et linguistiques": {"Lexique en lien avec les notions culturelles": ["Langages", "Codes socio-culturels et dimensions géographiques et historiques.", "Graphiques, schémas, cartes, logos, tableaux.", "Media, modes de communication, réseaux sociaux, publicité.", "Extraits de manuels scolaires de pays ou de la région de la langue cible.", "Langages artistiques : peinture, musique et chansons, poésie, cinéma et théâtre, littérature, BD, science-fiction.", "Représentations de sculptures, tableaux, œuvres architecturales, monuments.", "École et société", "Comparaison des systèmes scolaires.", "Place de la question de l’environnement dans le quotidien des élèves des pays concernés (l’eau, les espaces verts et l’urbanisme, le traitement des déchets et le recyclage, les économies d’énergie, les différentes formes de pollution, la consommation responsable). Mise en place de projets eTwinning d’échange avec une classe partenaire sur la question.", "Activités scolaires et extrascolaires : : les activités de loisirs écoresponsables. La consommation écoresponsable. Les parcs urbains et nationaux.", "Découverte du monde du travail : fiches métier et, notamment, des métiers ayant trait à l’environnement (par exemple les métiers contribuant à la mise en place du tournant énergétique, au recyclage, au traitement de l’eau…).", "Fiches métier.", "Voyages et migrations", "Voyages scolaires, touristiques. Le tourisme écoresponsable, l’empreinte carbone.", "Exil, migration et émigration.", "L'imaginaire, le rêve, le fantastique.", "Rencontres avec d'autres cultures", "Repères historiques et géographiques.", "Patrimoine historique naturel et architectural.", "Inclusion et exclusion.", "Parcs nationaux. Réserves de biosphères", "Les spécificités climatiques des pays concernés, leur biodiversité.", "Les énergies renouvelables développées dans les pays concernés."], "Grammaire": ["Nom et groupe nominal", "Connaître et utiliser le genre, les pronoms personnels compléments et réfléchis.", "Détermination", "Connaître et utiliser les articles, les quantifieurs.", "Groupe verbal", "Connaître et utiliser l'expression du présent, du passé, de l'avenir.", "Connaître et utiliser les modaux.", "Connaître et utiliser le passif.", "Connaître et utiliser la construction des verbes.", "Enoncés simples et complexes", "Connaître et utiliser la coordination.", "Connaître et utiliser la subordination.", "Connaître et utiliser les relatifs.", "Connaître et utiliser le discours indirect.", "Connaître et utiliser l'interrogation indirecte.", "Connaître et utiliser les connecteurs."], "Phonologie": ["Prendre conscience des régularités de la langue orale.", "Prendre conscience des variations phoniques et phonologiques dans les usages d'une même langue.", "Viser la fluidité, l'intelligibilité, la sécurité linguistique personnelle dans la production orale : ne pas viser « l'accent natif »."]}}, "Arts plastiques": {"La représentation ; images, réalité et fiction": {"La ressemblance": ["Prendre conscience du rapport au réel et de la valeur expressive de l'écart en art.", "Analyser les images artistiques et leur rapport à la fiction, notamment la différence entre ressemblance et vraisemblance."], "Le dispositif de représentation": ["Observer l'espace en deux dimensions (littéral et suggéré), la différence entre organisation et composition.", "Observer l'espace en trois dimensions (différence entre structure, construction et installation), l'intervention sur le lieu, l'installation ."], "La narration visuelle": ["Indentifier le mouvement et la temporalité suggérés ou réels, le dispositif séquentiel et la dimension temporelle, la durée, la vitesse, le rythme, le montage, le découpage, l'ellipse..."], "L'autonomie de l'œuvre d'art, les modalités de sonautoréférenciation": ["Prendre conscience de l'autonomie de l'œuvre vis-à-vis du monde visible.", "Prendre conscience de l'inclusion ou de la mise en abyme de ses propres constituants.", "Connaître les notions d'art abstrait, informel, concret..."], "La création, la matérialité, le statut, la signification des images": ["Appréhender et la comprendre la diversité des images.", "Prendre conscience de leurs propriétés plastiques, iconiques, sémantiques, symboliques.", "Identifier les différences d'intention entre expression artistique et communication visuelle, entre œuvre et image d'œuvre."], "La conception, la production et la diffusion de l'œuvre plastique à l'ère du numérique": ["Identifier les incidences du numérique sur la création des images fixes et animées, sur les pratiques plastiques en deux et en trois dimensions.", "Identifier les relations entre intentions artistiques, médiums de la pratique plastique, codes et outils numériques."]}, "La matérialité de l'œuvre ; l'objet et l'œuvre": {"La transformation de la matière": ["Prendre conscience des relations entre matières, outils, gestes.", "Identifier la réalité concrète d'une œuvre ou d'une production plastique.", "Comprendre le pouvoir de représentation ou de signification de la réalité physique globale de l'œuvre."], "Les qualités physiques des matériaux": ["Connaître les matériaux et leur potentiel de signification dans une intention artistique, leur nature et leurs caractéristiques,les notions de fini et non fini.", "Identifier l'agencement de matériaux et de matières de caractéristiques diverses (plastiques, techniques, sémantiques, symboliques)."], "La matérialité et la qualité de la couleur": ["Prendre conscience des relations entre sensation colorée et qualités physiques de la matière colorée.", "Connaître les relations entre quantité et qualité de la couleur."], "L'objet comme matériau en art": ["Identifier la transformation, les détournements des objets dans une intention artistique.", "Identifier la sublimation, la citation, les effets de décontextualisation et de recontextualisation des objets dans une démarche artistique."], "Les représentations et statuts de l'objet en art": ["Prendre conscience de la place de l'objet non artistique dans l'art.", "Considérer l'œuvre comme objet matériel, objet d'art, objet d'étude."], "Le numérique en tant que processus et matériau artistiques (langages, outils, supports)": ["S'approprier les outils et les langages numériques destinés à la pratique plastique.", "Comprendre les dialogues entre pratiques traditionnelles et numériques.", "S'interroger sur la manipulation du numérique par et dans la pratique plastique.", "Porter un regard critique sur le coût énergétique des usages du numérique."]}, "L'œuvre, l'espace, l'auteur, le spectateur": {"La relation du corps à la production artistique": ["Prendre conscience de l'implication du corps de l'auteur ; des effets du geste et de l'instrument, des qualités plastiques et des effets visuels obtenus.", "Identifier la lisibilité du processus de production et de son déploiement dans le temps et dans l'espace : traces, performance, théâtralisation, événements, œuvres éphémères, captations..."], "La présence matérielle de l'œuvre dans l'espace, la présentation de l'œuvre": ["Identifier le rapport d'échelle, l'in situ, les dispositifs de présentation, la dimension éphémère, l'espace public.", "Explorer les présentations des productions plastiques et des œuvres.", "Avoir des notions d'architecture."], "L'expérience sensible de l'espace de l'œuvre": ["Prendre conscience des rapports entre l'espace perçu, ressenti et l'espace représenté ou construit.", "Identifier l'espace et le temps comme matériaux de l'œuvre, la mobilisation des sens.", "Prendre en compte le point de vue de l'auteur et du spectateur dans ses relations à l'espace, au temps de l'œuvre, à l'inscription de son corps dans la relation à l'œuvre ou dans l'œuvre achevée."], "Les métissages entre arts plastiques et technologies numériques": ["Identifier les évolutions repérables sur la notion d'œuvre et d'artiste, de créateur, de récepteurs ou de public.", "Connaître les croisements entre arts plastiques et les sciences, les technologies, les environnements numériques."]}}, "Physique-Chimie": {"Organisation et transformations de la matière.": {"Décrire la constitution et les états de la matière": ["Caractériser les différents états de la matière (solide, liquide et gaz).", "Proposer et mettre en œuvre un protocole expérimental pour étudier les propriétés des changements d'état.", "Caractériser les différents changements d'état d'un corps pur.", "Interpréter les changements d'état au niveau microscopique.", "Proposer et mettre en œuvre un protocole expérimental pour déterminer une masse volumique d'un liquide ou d'un solide.", "Exploiter des mesures de masse volumique pour différencier des espèces chimiques.", "Connaître les notions d'espèce chimique et de mélange.", "Connaître les notion de corps pur.", "Connaître les changements d'états de la matière.", "Connaître les notions de conservation de la masse, de variation du volume, de température de changement d'état.", "Connaître la notion de masse volumique : Relation m = ρ.V. et l'influence de la température.", "Concevoir et réaliser des expériences pour caractériser des mélanges.", "Estimer expérimentalement une valeur de solubilité dans l'eau.", "Connaître la notion de solubilité.", "Connaître la notion de miscibilité.", "Connaître la composition de l'air."], "Décrire et expliquer des transformations chimiques": ["Mettre en œuvre des tests caractéristiques d'espèces chimiques à partir d'une banque fournie.", "Identifier expérimentalement une transformation chimique.", "Distinguer transformation chimique et mélange, transformation chimique et transformation physique.", "Interpréter une transformation chimique comme une redistribution des atomes.", "Utiliser une équation de réaction chimique fournie pour décrire une transformation chimique observée.", "Connaître les notions de molécules, atomes, ions.", "Prendre conscience de la conservation de la masse lors d'une transformation chimique.", "Associer leurs symboles aux éléments à l'aide de la classification périodique.", "Interpréter une formule chimique en termes atomiques.", "Connaître l'existence des éléments suivants : dioxygène, dihydrogène, diazote, eau, dioxyde de carbone, méthane, protoxyde d'azote.", "Propriétés de quelques transformations chimiques", "Identifier le caractère acide ou basique d'une solution par mesure de pH.", "Associer le caractère acide ou basique à la présence d'ions H+ et OH-.", "Identifier les gaz à effet de serre produits lors de transformations chimiques.", "Connaître les éléments suivants : ions H+ et OH-.", "Savoir mesurer du pH.", "Comprendre les phénomènes de combustions dans l'air.", "Connaître les réactions entre solutions acides et basiques.", "Connaître les réactions de corrosion d'un métal.", "Connaitre les gaz à effet de serre."], "Décrire l'organisation de la matière dans l'Univers": ["Décrire la structure de l'Univers et du système solaire.", "Aborder les différentes unités de distance et savoir les convertir : du kilomètre à l'année-lumière.", "Connaître les notions de galaxies, évolution de l'Univers, formation du système solaire, âges géologiques.", "Connaître et utiliser les ordres de grandeur de quelques distances astronomiques.", "Connaitre et comprendre l'origine de la matière.", "Comprendre que la matière observable est partout de même nature et obéit aux mêmes lois.", "Comparer les ressources terrestres de certains éléments.", "Connaître la matière constituant la Terre et les étoiles.", "Connaître l'existence des éléments sur Terre et dans l'univers (hydrogène, hélium, éléments lourds : oxygène, carbone, fer, silicium, terres rares...).", "Connaître les notions suivantes : constituants de l'atome, structure interne d'un noyau atomique (nucléons : protons, neutrons), électrons."]}, "Mouvement et interactions": {"Caractériser un mouvement": ["Caractériser le mouvement d'un objet.", "Utiliser la relation liant vitesse, distance et durée dans le cas d'un mouvement uniforme.", "Connaître la notion de vitesse : direction, sens et valeur.", "Connaître les notions de mouvements rectilignes et circulaires.", "Connaître l'existence de mouvements uniformes et mouvements dont la vitesse varie au cours du temps en direction ou en valeur.", "Prendre conscience de la relativité du mouvement dans des cas simples."], "Modéliser une action exercée sur un objet par une force caractérisée par une direction, un sens et une valeur": ["Identifier les actions mises en jeu (de contact ou à distance) et les modéliser par des forces.", "Associer la notion d'interaction à la notion de force.", "Exploiter l'expression littérale scalaire de la loi de gravitation universelle, la loi étant fournie.", "Connaître les notions d'action de contact et action à distance.", "Connaître la notion de force : point d'application, direction, sens et valeur.", "Connaître la notion de force de pesanteur et son expression P=mg."]}, "L'énergie, ses transferts et ses conversions": {"Identifier les sources, les transferts, les conversions et les formes d'énergie. Utiliser la conservation de l'énergie": ["Identifier les différentes formes d'énergie.", "Identifier un dispositif de conversion d'énergie dont le fonctionnement s'accompagne d'une émission de dioxyde de carbone.", "Connaître les notions d'énergies cinétique (relation Ec = ½ mv2), potentielle (dépendant de la position), thermique, électrique, chimique, nucléaire, lumineuse.", "Identifier les sources, les transferts et les conversions d'énergie.", "Établir un bilan énergétique pour un système simple.", "Connaître les sources d'énergie.", "Connaître la notion de transferts d'énergie.", "Connaître la notion de conversion d'une forme d'énergie en une autre.", "Connaître la notion de conservation de l'énergie.", "Connaitre les unités d'énergie.", "Analyser une situation où, pour un système donné, les valeurs des transferts d'énergie entrant et sortant sont différentes.", "Utiliser la relation liant puissance, énergie et durée.", "Connaître et utiliser la notion de puissance.", "Associer l'émission et l'absorbtion d'un rayonnement à un transfert d'énergie.", "Comprendre la notion de rayonnement émis par un objet.", "Comprendre la notion d'absorbtion d'un rayonnement par un objet.", "Comprendre la notion de transfert d'énergie par rayonnement.", "Connaitre le phénomène d'absorbtion du rayonnement terrestre par les gaz à effet de serre."], "Réaliser des circuits électriques simples et exploiter les lois de l'électricité": ["Élaborer et mettre en œuvre un protocole expérimental simple visant à réaliser un circuit électrique répondant à un cahier des charges ou à vérifier une loi de l'électricité.", "Exploiter les lois de l'électricité.", "Connaître les notions de dipôles en série, dipôles en dérivation.", "Savoir que l'intensité du courant électrique est la même en tout point d'un circuit qui ne compte que des dipôles en série.", "Connaître la loi d'additivité des tensions (circuit à une seule maille).", "Connaître la loi d'additivité des intensités (circuit à deux mailles).", "Connaître la relation tension-courant: loi d'Ohm.", "Connaître la loi d'unicité des tensions.", "Mettre en relation les lois de l'électricité et les règles de sécurité dans ce domaine.", "Conduire un calcul de consommation d'énergie électrique relatif à une situation de la vie courante.", "Connaître la notion de puissance électrique P= U.I.", "Connaître la relation liant l'énergie, la puissance électrique et la durée."]}}, "Technologie": {"Design, innovation et créativité": {"Imaginer des solutions en réponse aux besoins, matérialiser une idée en intégrant une dimension design": ["Identifier un besoin (biens matériels ou services) et énoncer un problème technique ; identifier les conditions, contraintes et ressources correspondantes dans une logique d'écoconception, qualifier et quantifier simplement les performances d'un objet technique existant ou à créer.", "Connaître les notions de besoin, contraintes, normalisation.", "Connaître les principaux éléments d'un cahier des charges.", "Imaginer, synthétiser et formaliser une procédure, un protocole.", "Connaître les outils numériques de présentation.", "Comprendre ce qu'est un charte graphique.", "Participer à l'organisation de projets, la définition des rôles, la planification (se projeter et anticiper) et aux revues de projet.", "Connaître l'organisation d'un groupe de projet, le rôle des participants, le planning, la revue de projets.", "Imaginer des solutions pour produire des objets et des éléments de programmes informatiques en réponse au besoin.", "Connaître la notion de design.", "Connaître les notions d'innovation et de créativité.", "Comprendre l'utilité de la veille.", "Représenter des solutions (croquis, schémas, algorithmes).", "Comprendre la notion de réalité augmentée.", "Connaître les objets connectés.", "Organiser, structurer et stocker des ressources numériques.", "Connaître la notion d'arborescence.", "Présenter à l'oral et à l'aide de supports numériques multimédia des solutions techniques au moment des revues de projet.", "Connaître et utiliser les outils numériques de présentation.", "Connaître la notion de charte graphique."], "Réaliser, de manière collaborative, le prototype d'un objet communicant": ["Réaliser, de manière collaborative, le prototype d'un objet pour valider une solution.", "Prototyper rapidement des structures et des circuits de commande à partir de cartes standard."]}, "Les objets techniques, les services et les changements induits dans la société": {"Comparer et commenter les évolutions des objets et systèmes": ["Regrouper des objets en familles et lignées.", "Connaître l'évolution des objets.", "Connaître les impacts sociétaux et environnementaux dus aux objets.", "Connaître la notion de cycle de vie.", "Connaître et appliquer les règles d'un usage raisonné des objets communicants en respectant la propriété intellectuelle et l'intégrité d'autrui.", "Relier les évolutions technologiques aux inventions et innovations qui marquent des ruptures dans les solutions techniques.", "Comparer et commenter les évolutions des objets en articulant différents points de vue : fonctionnel, structurel, environnemental (ressources disponibles, matériaux utilisés, bilan carbone, procédé de fabrication, recyclage...), technique, scientifique, social, historique, économique.", "Élaborer un document qui synthétise ces comparaisons et ces commentaires.", "Connaître et utiliser les outils numériques de présentation.", "Connaître la notion de charte graphique."], "Exprimer sa pensée à l'aide d'outils de description adaptés": ["Exprimer sa pensée à l'aide d'outils de description adaptés : croquis, schémas, graphes, diagrammes, tableaux.", "Savoir faire des croquis à main levée.", "Savoir faire différents schémas.", "Savoir faire une carte heuristique.", "Connaître la notion d'algorithme.", "Lire, utiliser et produire, à l'aide d'outils de représentation numérique, des choix de solutions sous forme de dessins ou de schémas.", "Connaître et utiliser des outils numériques de description des objets techniques."]}, "La modélisation et la simulation des objets et systèmes techniques": {"Analyser le fonctionnement et la structure d'un objet": ["Respecter une procédure de travail garantissant un résultat en respectant les règles de sécurité et d'utilisation des outils mis à disposition.", "Connaître les notions de procédures, de protocoles.", "Connaître la notion d'ergonomie.", "Associer des solutions techniques à des fonctions.", "Connaître la notion d'analyse fonctionnelle systémique.", "Analyser le fonctionnement et la structure d'un objet, identifier les entrées et sorties.", "Savoir faire une représentation fonctionnelle des systèmes.", "Connaître la notion de structure des systèmes.", "Connaître la notion de chaîne d'énergie.", "Connaître la notion de chaîne d'information.", "Identifier le(s) matériau(x), les flux d'énergie et d'information sur un objet et décrire les transformations qui s'opèrent.", "Connaître les familles de matériaux avec leurs principales caractéristiques.", "Connaître les sources d'énergies.", "Connaître la notion de chaîne d'énergie.", "Connaître la notion de chaîne d'information.", "Décrire, en utilisant les outils et langages de descriptions adaptés, le fonctionnement, la structure et le comportement des objets.", "Connaître et utiliser les outils de description d'un fonctionnement, d'une structure et d'un comportement.", "Mesurer des grandeurs de manière directe ou indirecte.", "Connaître et utiliser les instruments de mesure usuels.", "Connaître le principe de fonctionnement d'un capteur, d'un codeur, d'un détecteur.", "Connaître la nature du signal : analogique ou numérique.", "Connaître la nature d'une information : logique ou analogique.", "Interpréter des résultats expérimentaux, en tirer une conclusion et la communiquer en argumentant.", "Connaître les notions d'écarts entre les attentes fixées par le cahier des charges et les résultats de l'expérimentation."], "Utiliser une modélisation et simuler le comportement d'un objet": ["Utiliser une modélisation pour comprendre, formaliser, partager, construire, investiguer, prouver.", "Connaître et utiliser les outils de description d'un fonctionnement, d'une structure et d'un comportement.", "Simuler numériquement la structure et/ou le comportement d'un objet. Interpréter le comportement de l'objet technique et le communiquer en argumentant.", "Connaître les notions d'écarts entre les attentes fixées par le cahier des charges et les résultats de la simulation."]}, "L'informatique et la programmation": {"Comprendre le fonctionnement d'un réseau informatique": ["Connaître les composants d'un réseau, l'architecture d'un réseau local, les moyens de connexion d'un moyen informatique.", "Connaître la notion de protocole, d'organisation de protocoles en couche, d'algorithme de routage, .", "Connaître Internet."], "Écrire, mettre au point et exécuter un programme": ["Analyser le comportement attendu d'un système réel et décomposer le problème posé en sous-problèmes afin de structurer un programme de commande.", "Écrire, mettre au point (tester, corriger) et exécuter un programme commandant un système réel et vérifier le comportement attendu.", "Écrire un programme dans lequel des actions sont déclenchées par des événements extérieurs.", "Connaître les notions d'algorithme et de programme.", "Connaître la notion de variable informatique.", "Comprendre le déclenchement d'une action par un événement, séquences d'instructions, boucles, instructions conditionnelles.", "Connaître la notion de systèmes embarqués.", "Connaître la notion de forme et transmission du signal.", "Connaître les notions de capteur, d'actionneur, d'interface."]}}, "Mathématiques": {"Nombres et calculs": {"Utiliser les nombres pour comparer, calculer et résoudre des problèmes.": ["Nombres", "Connaître les nombres décimaux (positifs et négatifs), la notion d’opposé.", "Connaître les fractions, les nombres rationnels (positifs et négatifs), la notion d’inverse.", "Connaître les carrés parfaits de 1 à 144.", "Connaître la définition de la racine carrée.", "Connaître les préfixes de nano à giga.", "Utiliser diverses représentations d’un même nombre (écriture décimale ou fractionnaire, notation scientifique, repérage sur une droite graduée).", "Passer d’une représentation d’un nombre à une autre.", "Comparaisons de nombres", "Connaître la notion d’égalité de fractions (démonstration possible à partir de la définition du quotient).", "Connaître la notion d’ordre sur les nombres rationnels en écriture décimale ou fractionnaire.", "Comparer, ranger, encadrer des nombres rationnels en écriture décimale, fractionnaire ou scientifique.", "Repérer et placer un nombre rationnel sur une droite graduée.", "Associer à des objets des ordres de grandeur (par exemple taille d’un atome, d’une bactérie, d’une alvéole pulmonaire, longueur de l’intestin, capacité de stockage d’un disque dur, vitesses du son et de la lumière, populations française et mondiale, distance Terre-Lune, distance du Soleil à l’étoile la plus proche, etc.).", "Pratiquer le calcul exact ou approché, mental, à la main ou instrumenté", "Connaître les notions de somme, différence, produit, quotient de nombres décimaux, de deux nombres rationnels.", "Connaître la définition des puissances d’un nombre (exposants entiers, positifs ou négatifs).", "Connaître la notation scientifique.", "Calculer avec des nombres relatifs, des fractions, des nombres décimaux.", "Vérifier la vraisemblance d’un résultat, notamment en estimant son ordre de grandeur.", "Effectuer des calculs numériques simples impliquant des puissances, notamment en utilisant la notation scientifique.", "Utiliser la racine carrée pour résoudre des problèmes, notamment géométriques.", "Effectuer des calculs et des comparaisons pour traiter des problèmes."], "Comprendre et utiliser les notions de divisibilité et de nombres premiers.": ["Connaître la notion de multiples et diviseurs.", "Connaître les critères de divisibilité par 2, 3, 5, 9.", "Comprendre la division euclidienne (quotient, reste).", "Connaître la définition d’un nombre premier ; connaître la lliste des nombres premiers inférieurs ou égaux à 30.", "Connaître la notion de fractions irréductibles.", "Déterminer si un entier est ou n’est pas multiple ou diviseur d’un autre entier.", "Déterminer les nombres premiers inférieurs ou égaux à 100.", "Utiliser les critères de divisibilité par 2, 3, 5, 9, 10.", "Déterminer les diviseurs d’un nombre à la main, à l’aide d’un tableur, d’une calculatrice.", "Décomposer un nombre entier en produit de facteurs premiers (à la main ou à l’aide d’un logiciel).", "Simplifier une fraction pour la rendre irréductible.", "Modéliser et résoudre des problèmes mettant en jeu la divisibilité (engrenages, conjonction de phénomènes, etc.)."], "Utiliser le calcul littéral.": ["Connaître les notions d’inconnue, d’équation, d’indéterminée, d’identité.", "Connaître les propriétés de distributivité (simple et double).", "Connaître la notion d’annulation d’un produit (démonstration possible par disjonction de cas).", "Connaître la factorisation de a² – b².", "Développer, factoriser, réduire des expressions algébriques dans des cas très simples.", "Utiliser le calcul littéral pour traduire une propriété générale (par exemple la distributivité simple), pour démontrer un résultat général (par exemple que la somme de trois entiers consécutifs est un multiple de trois), pour valider ou réfuter une conjecture, pour modéliser une situation.", "Mettre un problème en équation en vue de sa résolution.", "Résoudre algébriquement des équations du premier degré ou s’y ramenant (équations produits), en particulier des équations du type x² = a.", "Avoir mémorisé ou automatisé les règles de calcul sur les nombres relatifs et les fractions, notamment la condition d’égalité de deux fractions (si ad = bc, alors a/b = c/d et réciproquement).", "Avoir mémorisé ou automatisé les conventions d’écritures du calcul littéral.", "Avoir mémorisé ou automatisé les formules de distributivité simple et double.", "Avoir mémorisé ou automatisé l’identité a² – b² = (a – b)(a + b).", "Avoir mémorisé ou automatisé les procédures de résolution d’équations du type ax = b et a + x = b."]}, "Organisation et gestion de données, fonctions": {"Interpréter, représenter et traiter des données.": ["Comprendre les notions d’effectifs, de fréquences.", "Connaître la notion d’indicateurs de position : moyenne, médiane.", "Connaître la notion d’indicateurs de dispersion : étendue.", "Recueillir des données, les organiser.", "Lire et interpréter des données sous forme de données brutes, de tableau, de diagramme (diagramme en bâtons, diagramme circulaire, histogramme).", "Utiliser un tableur-grapheur pour présenter des données sous la forme d’un tableau ou d’un diagramme.", "Calculer des effectifs, des fréquences.", "Calculer et interpréter des indicateurs de position ou de dispersion d'une série statistique."], "Comprendre et utiliser des notions élémentaires de probabilités.": ["Connaître le vocabulaire des probabilités.", "Comprendre la notion de probabilité ; la probabilité d’un événement est comprise entre 0 et 1.", "Comprendre la notion de probabilité d’événements certains, impossibles, contraires.", "Aborder les questions relatives au hasard à partir de problèmes simples.", "Calculer des probabilités dans des cas simples (par exemple évaluation des chances de gain dans un jeu).", "Exprimer des probabilités sous diverses formes (décimale, fractionnaire, pourcentage).", "Faire le lien entre fréquence et probabilité."], "Résoudre des problèmes de proportionnalité.": ["Comprendre la notion de coefficient de proportionnalité.", "Connaître les notions de taux d’évolution, coefficient multiplicateur.", "Connaître la notion de ratio.", "Reconnaître une situation de proportionnalité ou de non-proportionnalité.", "Calculer une quatrième proportionnelle.", "Partager une quantité (par exemple une somme d’argent) en deux ou trois parts selon un ratio donné.", "Utiliser une formule liant deux grandeurs dans une situation de proportionnalité (par exemple la longueur d’un cercle en fonction de son rayon, la loi d’Ohm exprimant la tension en fonction de l’intensité, la distance parcourue en fonction du temps à vitesse constante, etc.).", "Résoudre des problèmes utilisant la proportionnalité (pourcentages, échelles, agrandissement réduction)."], "Comprendre et utiliser la notion de fonction.": ["Connaître le vocabulaire : variable, fonction, antécédent, image.", "Connaître les différents modes de représentation d’une fonction (expression symbolique, tableau de valeurs, représentation graphique, programme de calcul).", "Connaître les notations f(x) et x → f(x).", "Connaître les notions de fonction linéaire, fonction affine.", "Passer d’un mode de représentation d’une fonction à un autre.", "Déterminer, à partir d’un mode de représentation, l’image ou un antécédent d’un nombre par une fonction.", "Représenter graphiquement une fonction linéaire, une fonction affine.", "Modéliser un phénomène continu par une fonction.", "Modéliser une situation de proportionnalité à l’aide d’une fonction linéaire.", "Résoudre des problèmes modélisés par des fonctions.", "Avoir mémorisé ou automatisé différentes procédures de calcul d’une quatrième proportionnelle.", "Avoir mémorisé ou automatisé l’allure de la représentation graphique d’une fonction affine ou linéaire.", "Avoir mémorisé ou automatisé les procédures d’application et de calcul d’un pourcentage ou d’une échelle.", "Avoir mémorisé ou automatisé les procédures de recherche d’image et d’antécédent d’un nombre par une fonction."]}, "Grandeurs et mesures": {"Calculer avec des grandeurs mesurables ; exprimer les résultats dans les unités adaptées.": ["Connaître la notion de grandeur produit et de grandeur quotient.", "Mesurer l’aire du parallélogramme (obtenue à partir de celle du rectangle par découpage et recollement).", "Connaître la formule donnant le volume d’un prisme, d’une pyramide, d’un cylindre, d’un cône, d’une boule.", "Connaître la correspondance entre unités de volume et de contenance (1 L = 1 dm3, 1 000 L = 1 m³).", "Mener des calculs impliquant des grandeurs mesurables, notamment des grandeurs composées, exprimer les résultats dans les unités adaptées.", "Vérifier la cohérence des résultats du point de vue des unités.", "Effectuer des conversions d’unités."], "Comprendre l’effet de quelques transformations sur les figures géométriques.": ["Comprendre l’effet d’un déplacement, d'un agrandissement ou d'une réduction sur les longueurs, les angles, les aires et les volumes.", "Utiliser un rapport de réduction ou d'agrandissement (architecture, maquettes) pour calculer des longueurs, des aires, des volumes.", "Utiliser l’échelle d’une carte.", "Utiliser des transformations pour calculer des grandeurs géométriques.", "Faire le lien entre la proportionnalité et certaines configurations ou transformations géométriques (agrandissement réduction, triangles semblables, homothéties).", "Avoir mémorisé et automatisé les formules donnant les longueurs, aires, volumes des figures et solides figurant au programme, ainsi que les procédures de conversion d’unités."]}, "Espace et géométrie": {"Représenter l’espace.": ["Connaître les notions d’abscisse, d’ordonnée, d’altitude.", "Connaître les notions de latitude, longitude.", "(Se) repérer sur une droite graduée, dans le plan muni d'un repère orthogonal, dans un parallélépipède rectangle, sur une sphère.", "Reconnaître des solides (pavé droit, cube, cylindre, pyramide, cône, boule).", "Construire et mettre en relation des représentations de ces solides (vues en perspective cavalière, de face, de dessus, sections planes, patrons, etc.).", "Utiliser un logiciel de géométrie dynamique pour représenter des solides."], "Utiliser les notions de géométrie plane pour démontrer.": ["Connaître la caractérisation angulaire du parallélisme : angles alternes internes, angles correspondants.", "Connaître les caractéristiques du triangle : somme des angles d’un triangle (démonstration possible en utilisant les angles correspondants), hauteurs et médiatrices, inégalité triangulaire, cas d’égalité des triangles, triangles semblables (une définition et une propriété caractéristique).", "Connaître une définition et une propriété caractéristique du parallélogramme.", "Connaître le théorème de Thalès et sa réciproque (configurations des triangles emboîtés et du Papillon).", "Connaître le théorème de Pythagore et sa réciproque.", "Connaître les notions de lignes trigonométriques dans le triangle rectangle : cosinus, sinus, tangente.", "Mettre en œuvre ou écrire un protocole de construction d’une figure géométrique.", "Faire le lien entre les cas d’égalité des triangles et la construction d’un triangle à partir de la donnée de longueurs des côtés et/ou de mesures d’angles.", "Comprendre l’effet d’une translation, d’une symétrie (axiale et centrale), d’une rotation, d’une homothétie sur une figure.", "Mobiliser les connaissances des figures, des configurations et des transformations au programme pour déterminer des grandeurs géométriques.", "Mener des raisonnements et s’initier à la démonstration en utilisant les propriétés des figures, des configurations et des transformations.", "Avoir mémorisé des images mentales (configurations de Pythagore et de Thalès, lignes trigonométriques dans un triangle rectangle) et automatisé les procédures de repérage et de constructions géométriques liées aux figures et aux transformations du programme."]}, "Algorithmique et programmation": {"Écrire, mettre au point, exécuter un programme.": ["Connaître les notions d’algorithme et de programme.", "Connaître la notion de variable informatique.", "Connaître le déclenchement d’une action par un événement.", "Connaître les séquences d’instructions, boucles, instructions conditionnelles.", "Écrire, mettre au point (tester, corriger) et exécuter un programme en réponse à un problème donné."]}}, "Enseignement moral et civique 2024": {"5ème Égalité, fraternité et solidarité": {"Agir pour l’égalité femmes-hommes et lutter contre les discriminations": ["Égalité femmes-hommes", "Savoir que l’égalité entre les femmes et les hommes est un principe fondamental de la République française, garanti par la Constitution (article 3 du préambule de 1946 : « La loi garantit à la femme, dans tous les domaines, des droits égaux à ceux de l’homme. ») et des démocraties modernes, c’est aussi un objectif de développement durable (ODD5).", "Égalité en droits, parité", "Avoir conscience que dans la vie professionnelle et quotidienne, de nombreuses inégalités demeurent et les violences sexistes et sexuelles persistent, et qu'elles nécessitent l’action des pouvoirs publics et de la société civile.", "Discrimination, inclusion", "Savoir que la discrimination est un délit qui contrevient au principe d’égalité et que le Code pénal définit la discrimination comme « toute distinction opérée entre les personnes physiques » selon des critères liés à leur origine, à leur sexe, orientation sexuelle et identité de genre, à leur nationalité, à leur religion, à leur apparence physique, leur handicap, leur situation de grossesse, leur santé ou leur activité syndicale, etc. (art. 225-1), punie dans certaines situations constituant un traitement défavorable (art. 225-2).", "Racisme, antisémitisme, antitsiganisme, xénophobie, haine anti-LGBT", "Avoir conscience qu'à la racine des agissements discriminatoires se trouvent des mécanismes d’exclusion (stéréotypes, préjugés, etc.) qui réduisent l’identité d’un individu à son appartenance à un groupe que l’on stigmatise. On retrouve ces stéréotypes dans le racisme, l’antisémitisme et la xénophobie, punis par la loi.", "Harcèlement", "Savoir que les agissements discriminatoires sont aussi à la racine du harcèlement, y compris du harcèlement en ligne (depuis 2022, le harcèlement scolaire est reconnu comme un délit)."], "La solidarité et ses échelles": ["Solidarité, fraternité", "Savoir que le principe de solidarité signifie que la Nation assure aux individus libres et égaux en droit une protection. Au nom de ce principe, lié à l’idéal de fraternité, l’État, les collectivités territoriales et la société civile (associations) unissent leurs forces pour réduire les inégalités et protéger les citoyennes et les citoyens contre les risques sociaux et environnementaux.", "Savoir que l’impôt traduit la participation des citoyennes et des citoyens à la solidarité nationale (impôts directs et indirects).", "Savoir que la solidarité s’exerce également à l’échelle de l’Union européenne et, dans le cadre de l’aide au développement (y compris durable), à l’échelle mondiale (institutions internationales et ONG).", "Risques sociaux, sécurité sociale", "Avoir conscience que les risques sociaux (maladie, accident, invalidité, grossesse non désirée, perte d’emploi, perte d’autonomie liée à l’âge) sont tous les événements auxquels les individus risquent de ne pouvoir faire face avec leurs seules ressources. La Sécurité sociale et le système public de santé participent de la solidarité nationale ; le droit international garantit aux enfants le droit à la santé et à la sécurité sociale (art. 24 à 26 CIDE).", "Risques environnementaux", "Avoir conscience que les risques environnementaux (pollutions, incendies, catastrophes naturelles liées ou non au changement climatique) nécessitent la mobilisation de moyens à toutes les échelles, pour la prévention, la mise en sécurité des personnes, l’aide aux victimes et la reconstruction (loi du 13 août 2004)."]}, "4ème Défendre les droits et les libertés": {"L’État de droit et les libertés": ["Libertés et droits fondamentaux, libertés individuelles et libertés collectives", "Savoir que les libertés individuelles permettent aux citoyennes et aux citoyens d’être maîtres de leurs mouvements et de leurs choix (liberté de circulation ou de mariage, par exemple), mais aussi de leurs opinions et croyances (liberté d’opinion, liberté de conscience), ainsi que d’exprimer celles-ci (liberté d’expression), y compris en ligne. Savoir que les libertés collectives permettent de s’associer les uns avec les autres et de s’engager dans la vie de la société (droit de réunion, d’association, de manifestation, droit syndical, liberté de la presse). Comprendre qu'il s’agit de libertés fondamentales et de droits inconditionnels associés à l’idée de dignité humaine.", "Ordre public", "Savoir que nos libertés sont toutefois encadrées par la loi et limitées, en premier lieu par les libertés des autres, que nous n’avons pas le droit d’entraver ou de violer (art. 4 DDHC) ; ensuite par la défense de l’ordre public qui concerne non seulement la sécurité, mais également la tranquillité, la salubrité, le respect de la dignité de la personne humaine, qui permettent à chacun de jouir de ses droits et de ses libertés .", "Etat de droit et hiérarchie des normes", "Savoir que les libertés sont garanties par le droit, qu'elles figurent dans le bloc de constitutionnalité reconnu par le Conseil constitutionnel, et que l’action de l’État elle-même est soumise à la justice (son action ne peut violer les droits du citoyen).", "Justice et institutions judiciaires", "Savoir que l’indépendance de la justice est une condition de l’État de droit, son organisation garantissant le traitement équitable des justiciables.", "Savoir que les droits et libertés sont enfin garantis par des traités internationaux et leur respect contrôlé par des cours supranationales (Cour européenne des droits de l’homme notamment)."], "Défendre le cadre démocratique : sécurité et défense nationale": ["Ordre public et souveraineté nationale, Défense", "Savoir que La « sûreté » fait partie des droits affirmés parla Déclaration des droits de l’homme et du citoyen (DDHC, art. 2). Elle signifie à la fois que les droits du citoyen sont protégés et qu’il doit se trouver en sécurité. Les forces de sécurité intérieure, comme la police, la gendarmerie, les pompiers et les douanes, répondent à cette exigence.", "Savoir que les forces armées ont vocation à défendre la souveraineté nationale, qui peut se trouver menacée ; qu'elles ont aussi pour mission de servir la Nation quand elle est engagée par des traités ou comme membre d’organisations internationales comme l’ONU. La défense doit également affronter de nouveaux enjeux comme la guerre informationnelle et la cyberdéfense.", "Savoir que la police de l’environnement assure la protection du droit de chacun à vivre dans un environnement « sain et équilibré »."]}, "3ème Faire vivre la démocratie": {"Les règles du jeu démocratique": ["Constitution", "3ème", "Savoir que la Constitution, norme juridique fondamentale, garantit les droits et libertés, détermine la séparation des pouvoirs, ainsi que le contrôle de l’action du gouvernement par le Parlement.", "3ème", "Savoir que la la Constitution de la Ve République fait référence à d’autres textes qui ont une valeur constitutionnelle (DDHC, préambule de la Constitution de 1946, Charte de l’environnement).", "Séparation des pouvoirs et laïcité de l'Etat", "3ème", "Savoir que la Constitution affirme que la République est laïque, ce qui signifie que l’autorité politique est indépendante des autorités religieuses. Toutefois, ces dernières peuvent participer au débat public dans les limites fixées par la loi (art. 35.1 et 36.3 de la loi de 1905) .", "3ème", "Savoir que depuis 1958, la Constitution a été l’objet de plusieurs modifications qui témoignent du caractère évolutif de la République française, notamment pour prendre en compte les enjeux environnementaux (Charte de l’environnement) .", "Institutions européennes", "3ème", "Savoir que depuis l’après-guerre, la démocratie française s’inscrit dans les institutions du Conseil de l’Europe et de l’UE, qui élargissent le champ du débat et définissent une citoyenneté européenne. Au sein de l’UE, les États membres sont tenus d’appliquer le droit communautaire (traités, règlements, directives, décisions de la Cour de justice de l’UE).."], "Les acteurs du jeu démocratique et leur engagement": ["Démocratie délibérative et opinion publique", "3ème", "Avoir conscience que la démocratie est un régime où l’opinion publique joue un rôle capital, qui s’exprime par l’intermédiaire des médias, dont les médias sociaux, et qu’on essaie de saisir par des sondages de natures diverses.", "Information/désinformation, complotisme", "3ème", "Avoir conscience que l’information constitue donc un enjeu essentiel, tout particulièrement à l’ère du numérique et avec l’émergence des « intelligences artificielles ».", "Lanceurs d'alerte", "3ème", "Avoir conscience que les médias sociaux sont eux aussi le lieu de débats et de mobilisations. Dans ce contexte, des lanceurs d’alerte prennent des risques pour informer leurs concitoyennes et leurs concitoyens."], "Les acteurs du jeu démocratique et leur engagement (2) : l'engagement collectif": ["Citoyenneté active, élections et référendum", "3ème", "Savoir que les campagnes électorales et les campagnes référendaires sont des occasions de débats (entre tous les citoyens, comme entre ceux qui sont déjà ou aspirent à être des représentants politiques) et des moments décisifs de la vie démocratique – le vote n’étant pas obligatoire, mais marquant un engagement au sein de la cité.", "3ème", "Avoir conscience que les formes traditionnelles de l’engagement demeurent décisives : engagement politique et exercice d’un mandat, engagement syndical, engagement associatif ou humanitaire, démocratie scolaire.", "3ème", "Avoir connaissance de l’engagement dans les institutions (armée, police, justice, éducation).", "3ème", "Avoir conscience que l’exercice de la liberté de manifester permet aux citoyennes et aux citoyens d’exprimer leurs opinions et de faire pression sur les gouvernements."]}}}};
        const sel = (id) => document.getElementById(id);

        // Init Niveaux
        Object.keys(data).forEach(l => {
            let o = new Option(l, l);
            sel('lvl').add(o);
        });

        sel('lvl').onchange = function() {
            reset(['disc', 'sd', 'item']);
            if(!this.value) return;
            fill('disc', Object.keys(data[this.value]));
            sel('disc').disabled = false;
        };

        sel('disc').onchange = function() {
            reset(['sd', 'item']);
            fill('sd', Object.keys(data[sel('lvl').value][this.value]));
            sel('sd').disabled = false;
        };

        sel('sd').onchange = function() {
            reset(['item']);
            fill('item', Object.keys(data[sel('lvl').value][sel('disc').value][this.value]));
            sel('item').disabled = false;
        };

        sel('item').onchange = function() {
            const list = data[sel('lvl').value][sel('disc').value][sel('sd').value][this.value];
            sel('list').innerHTML = list.map(c => `<li>${c}</li>`).join('');
            sel('result').style.display = 'block';
        };

        function fill(id, keys) {
            keys.forEach(k => sel(id).add(new Option(k, k)));
        }

        function reset(ids) {
            ids.forEach(id => {
                sel(id).innerHTML = '<option value="">-- Choisir --</option>';
                sel(id).disabled = true;
            });
            sel('result').style.display = 'none';
        }
    </script>
</body>
</html>
